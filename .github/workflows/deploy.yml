name: Deploy to VPS (Nginx + systemd)
on:
  workflow_run:
    workflows: ['CI - Quality & Tests']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dashboard-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      ${{ vars.ENABLE_PRODUCTION_DEPLOY == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      JWT_SECRET: build-only-secret
      JWT_REFRESH_SECRET: build-only-refresh-secret
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Reject obsolete deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$DEPLOY_SHA"
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate isolated build and runtime JWT keys
        run: |
          node -e "const fs=require('node:fs'),crypto=require('node:crypto'); for(const key of ['JWT_SECRET','JWT_REFRESH_SECRET']) fs.appendFileSync(process.env.GITHUB_ENV,key+'='+crypto.randomBytes(72).toString('base64url')+'\n');"

      - name: Build production bundle
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USERNAME"
          test -n "$SSH_FINGERPRINT"
          test -n "$SSH_PRIVATE_KEY$SSH_PASSWORD"
          test -n "$NEXT_PUBLIC_BASE_URL"
          test -n "$NEXT_PUBLIC_API_URL"
          pnpm build
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
      - name: Package runtime and migration dependencies
        run: |
          tar --exclude='.next/cache' --exclude='.next/dev' -czf dashboard-release.tar.gz .next public package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc next.config.mjs scripts lib migrations patches mcp/package.json
      - name: Transfer release
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: ${{ vars.SSH_PORT || '22' }}
          source: dashboard-release.tar.gz
          target: /var/www/lasmunecasderamon-dashboard/incoming/${{ github.event.workflow_run.head_sha }}
      - name: Install, migrate, restart and check health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: ${{ vars.SSH_PORT || '22' }}
          command_timeout: 20m
          envs: DEPLOY_SHA
          script: |
            set -eu
            ROOT=/var/www/lasmunecasderamon-dashboard
            RELEASE="$ROOT/releases/$DEPLOY_SHA"
            test -f "$ROOT/.env"
            test ! -e "$RELEASE"
            mkdir -p "$RELEASE"
            tar -xzf "$ROOT/incoming/$DEPLOY_SHA/dashboard-release.tar.gz" -C "$RELEASE"
            bash "$RELEASE/scripts/deploy-vps.sh" "$ROOT" "$DEPLOY_SHA"
