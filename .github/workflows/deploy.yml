name: Deploy to VPS (PM2)
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set deploy directory
        run: echo "DEPLOY_DIR=/var/www/lasmunecasderamon" >> $GITHUB_ENV

      - name: Resolve SSH host to IPv4
        run: |
          RESOLVED_HOST=$(python3 -c "import socket; print(socket.gethostbyname('${{ secrets.SSH_HOST }}'))")
          echo "SSH_IPV4_HOST=$RESOLVED_HOST" >> $GITHUB_ENV

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build application
        run: pnpm run build
        env:
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_IPV4_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: '.next/,public/,package.json,pnpm-lock.yaml,next.config.mjs,migrations/,scripts/run-migrations.mjs'
          target: '${{ env.DEPLOY_DIR }}'
          rm: false
          strip_components: 0

      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.SSH_IPV4_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Crear/Actualizar archivo .env
            cat <<EOF > .env
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            DB_NAME=${{ secrets.DB_NAME }}
            DB_PORT=${{ secrets.DB_PORT }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_WHATSAPP_NUMBER=${{ secrets.TWILIO_WHATSAPP_NUMBER }}
            ADMIN_WHATSAPP_NUMBER=${{ secrets.ADMIN_WHATSAPP_NUMBER }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            EOF

            # Configurar pnpm
            export PNPM_HOME="/root/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"

            if ! command -v pnpm &> /dev/null; then
              npm install -g pnpm@latest
            fi

            # Instalación limpia (incluye devDependencies porque next.config.mjs requiere plugins de build)
            # Saltar generate-sw del postinstall: el SW de producción ya lo generó el build (next build && node scripts/generate-sw.js)
            export SKIP_SW_GENERATE=1
            pnpm install --no-frozen-lockfile

            # Ejecutar migraciones de BD (idempotentes: ignoran columnas duplicadas)
            pnpm db:migrate

            # Limpiar logs anteriores
            pm2 flush

            # Eliminar todos los procesos existentes en PM2 para limpiar la lista y evitar duplicados
            pm2 delete all || true
            PORT=3000 pm2 start "pnpm start" --name "lasmunecasderamon-dashboard" --cwd "$DEPLOY_DIR"
            pm2 save

            # Verificar estado
            sleep 5
            pm2 status lasmunecasderamon-dashboard
            tail -n 20 logs/pm2-error.log || true
