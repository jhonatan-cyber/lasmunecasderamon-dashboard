name: Deploy Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          touch ~/.ssh/known_hosts

      - name: Update known_hosts
        run: |
          ssh-keygen -f ~/.ssh/known_hosts -R "***REMOVED***" || true
          ssh-keyscan -t ed25519 ***REMOVED*** >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 root@***REMOVED*** "\
          mkdir -p /root/lasmunecasderamon && \
          cd /root/lasmunecasderamon && \
          if [ ! -d .git ]; then \
            git clone https://jhonatan-cyber:${{ secrets.GH_PAT }}@github.com/jhonatan-cyber/lasmunecasderamon.git .; \
          else \
            git pull origin main; \
          fi && \
          docker-compose stop app && \
          docker-compose rm -f app && \
          docker-compose build app && \
          docker-compose up -d app \
          "
