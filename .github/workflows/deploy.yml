name: Deploy to VPS (PM2)
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set deploy directory
        run: echo "DEPLOY_DIR=/var/www/lasmunecasderamon" >> $GITHUB_ENV

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build application
        run: pnpm run build
        env:
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: ".next/,public/,package.json,pnpm-lock.yaml,next.config.mjs,middleware.ts"
          target: "${{ env.DEPLOY_DIR }}"
          rm: false
          strip_components: 0

      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            
            # Crear/Actualizar archivo .env
            cat <<EOF > .env
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            DB_NAME=${{ secrets.DB_NAME }}
            DB_PORT=${{ secrets.DB_PORT }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_WHATSAPP_NUMBER=${{ secrets.TWILIO_WHATSAPP_NUMBER }}
            ADMIN_WHATSAPP_NUMBER=${{ secrets.ADMIN_WHATSAPP_NUMBER }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            TZ=America/La_Paz
            EOF
            
            # Configurar pnpm
            export PNPM_HOME="/root/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"
            
            if ! command -v pnpm &> /dev/null; then
              npm install -g pnpm@latest
            fi
            
            # Instalación limpia (incluye devDependencies porque next.config.mjs requiere plugins de build)
            pnpm install --no-frozen-lockfile
            
            # Limpiar logs anteriores
            pm2 flush
            
            # Reiniciar con PM2 usando un shell wrapper para evitar SyntaxError de pnpm
            pm2 delete lasmunecas || true
            PORT=3000 pm2 start "pnpm start" --name "lasmunecas" --cwd "$DEPLOY_DIR"
            pm2 save
            
            # Verificar estado
            sleep 5
            pm2 status lasmunecas
            tail -n 20 logs/pm2-error.log || true
