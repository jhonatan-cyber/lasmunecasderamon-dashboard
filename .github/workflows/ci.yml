name: Web Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests
        run: pnpm test:e2e:smoke

      - name: Web quality audit (Markdown)
        run: pnpm audit:web:quality -- --output=reports/web-quality-audit/report.md

      - name: Web quality audit (JSON, blocking on selected high severities)
        run: pnpm audit:web:quality:ci -- --output=reports/web-quality-audit/report.json

      - name: Upload web quality audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-quality-audit
          path: reports/web-quality-audit
          if-no-files-found: error
