name: CI - Quality & Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'
  NEXT_TELEMETRY_DISABLED: '1'
  TZ: UTC

jobs:
  changes:
    name: Detect affected suites
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.diff.outputs.full }}
      build: ${{ steps.diff.outputs.build }}
      integration: ${{ steps.diff.outputs.integration }}
      e2e: ${{ steps.diff.outputs.e2e }}
      unit: ${{ steps.diff.outputs.unit }}
      redis: ${{ steps.diff.outputs.redis }}
      migrations: ${{ steps.diff.outputs.migrations }}
      mcp: ${{ steps.diff.outputs.mcp }}
      auth: ${{ steps.diff.outputs.auth }}
      caja: ${{ steps.diff.outputs.caja }}
      compras: ${{ steps.diff.outputs.compras }}
      inventario: ${{ steps.diff.outputs.inventario }}
      ventas: ${{ steps.diff.outputs.ventas }}
      personal: ${{ steps.diff.outputs.personal }}
      reportes: ${{ steps.diff.outputs.reportes }}
      whatsapp: ${{ steps.diff.outputs.whatsapp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tests/ci-changes.test.mjs
      - id: diff
        run: node scripts/ci-changes.mjs
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.event.workflow_run.head_sha }}
          CI_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

  quality:
    needs: changes
    if: needs.changes.outputs.build == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: ci-test-secret-only
      JWT_REFRESH_SECRET: ci-test-refresh-secret-only
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      PORT: '3000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint changed files
        if: needs.changes.outputs.full != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.workflow_run.head_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then BASE_SHA="$(git rev-parse "$HEAD_SHA^")"; fi
          FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.js' '*.jsx' '*.ts' '*.tsx' | tr '\n' ' ')"
          if [ -n "$FILES" ]; then pnpm exec eslint $FILES; fi

      - name: Lint all files
        if: needs.changes.outputs.full == 'true'
        run: pnpm lint:full

      - name: Architecture boundaries
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.integration == 'true'
        run: pnpm arquitectura:limites

      - name: Typecheck
        run: pnpm typecheck

      # El job coverage ya ejecuta toda la suite unitaria y exige sus umbrales.
      - name: Restore Next.js compiler cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-quality-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-quality-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Generate isolated build and runtime JWT keys
        run: |
          node -e "const fs=require('node:fs'),crypto=require('node:crypto'); for(const key of ['JWT_SECRET','JWT_REFRESH_SECRET']) fs.appendFileSync(process.env.GITHUB_ENV,key+'='+crypto.randomBytes(72).toString('base64url')+'\n');"

      - name: Build
        run: pnpm build

  redis:
    needs: changes
    if: needs.changes.outputs.redis == 'true'
    name: Redis (limitador, caché y seguridad)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: ghcr.io/redis/redis-stack-server:7.4.0-v3
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      JWT_SECRET: ci-test-secret-only
      JWT_REFRESH_SECRET: ci-test-refresh-secret-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cada test usa claves temporales con prefijo aleatorio y un relay TCP para
      # simular cortes: no detienen ni vacían el Redis del servicio.
      - name: Redis integration tests (limitador, caché, permisos, SSE y seguridad)
        run: pnpm test:redis

  migrations:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    name: Migrations (fresh database)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: ghcr.io/cloudnative-pg/postgresql:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres_ci
      DB_NAME: lasmunecasderamon
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrations drill on a freshly created database
        run: pnpm db:verify

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (informativo)
        run: pnpm audit --prod || true

      - name: Audit high+ vulnerabilities (bloqueante)
        run: pnpm audit --audit-level high

      - name: Outdated high-priority packages
        run: pnpm outdated --format list | head -50 || true

  coverage:
    needs: changes
    if: needs.changes.outputs.unit == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: ci-test-secret-only
      JWT_REFRESH_SECRET: ci-test-refresh-secret-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # run-affected-unit-tests compara BASE_SHA con HEAD_SHA.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit Tests with Coverage
        if: needs.changes.outputs.full == 'true'
        run: pnpm test:unit:coverage
        timeout-minutes: 15

      - name: Unit Tests for changed domains
        if: needs.changes.outputs.full != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.workflow_run.head_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/run-affected-unit-tests.mjs

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v7
        if: always() && needs.changes.outputs.full == 'true'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: ghcr.io/cloudnative-pg/postgresql:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: lasmunecasderamon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lasmunecasderamon_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres_ci
      DB_NAME: lasmunecasderamon_test
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Historial completo: el gate de paridad lee el volcado del commit base.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup database
        run: |
          node scripts/ci-setup-db.js
          node scripts/ci-seed-auth.cjs

      - name: Schema parity (fresh install and existing environment vs reference)
        shell: bash
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          pnpm db:parity --reference "$DB_NAME" --base-ref "$BASE_REF"

      - name: PostgreSQL repositories and maintenance
        run: pnpm exec vitest run --config vitest.ci-postgres.config.ts
        env:
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret

      - name: Integration tests (legacy-db + flows)
        run: |
          CI_LEGACY_FIXTURES=true node --import dotenv/config --input-type=module -e "import seed from './tests/setup/ci-fixtures.ts'; await seed();"
          pnpm test:integration:all

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: ghcr.io/cloudnative-pg/postgresql:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: lasmunecasderamon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lasmunecasderamon_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres_ci
      DB_NAME: lasmunecasderamon_test
      JWT_SECRET: ci-test-secret-only
      JWT_REFRESH_SECRET: ci-test-refresh-secret-only
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      BASE_URL: http://localhost:3000
      TEST_USER: Admin
      TEST_PASSWORD: CI-Only-Password-2026!
      SKIP_RATE_LIMIT: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup database
        run: |
          node scripts/ci-setup-db.js
          node scripts/ci-seed-auth.cjs

      - name: Generate isolated build and runtime JWT keys
        run: |
          node -e "const fs=require('node:fs'),crypto=require('node:crypto'); for(const key of ['JWT_SECRET','JWT_REFRESH_SECRET']) fs.appendFileSync(process.env.GITHUB_ENV,key+'='+crypto.randomBytes(72).toString('base64url')+'\n');"

      - name: Restore Next.js compiler cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: |
            playwright-report/
            test-results/
            logs/error.log
          retention-days: 7

  mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    name: MCP (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test` compila antes de ejecutar los tests; no repetir el build.
      # Los tests levantan un backend simulado propio; no requieren BD ni servicios externos.
      - name: MCP tests (node --test)
        run: pnpm --dir mcp test
