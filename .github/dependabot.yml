version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      minor-patch:
        update-types:
          - 'minor'
          - 'patch'
      major-test-runner:
        patterns:
          - 'vitest'
          - '@vitest/coverage-v8'
        update-types:
          - 'major'
    ignore:
      # The compiler API and typescript-eslint currently require TypeScript 5.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Production and CI run Node 24; its declarations must match the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Next's bundled React, import and accessibility plugins support ESLint 9.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'ci'
      - 'dependencies'
