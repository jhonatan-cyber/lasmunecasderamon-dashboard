version: "3.9"

services:
  db:
    image: mariadb:10.11
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Ancasi96nuwe+
      MYSQL_DATABASE: lasmunecasderamon
      MYSQL_USER: lasmuecasderamon
      MYSQL_PASSWORD: Ancasi96nuwe+
    ports:
      - "3307:3306"
    networks:
      - lasmunecasnet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: Ancasi96nuwe+
    ports:
      - "8000:80"
    networks:
      - lasmunecasnet

  app:
    build: .
    container_name: lasmunecasderamon-app
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: lasmunecasderamon
      DB_USER: lasmuecasderamon
      DB_PASSWORD: Ancasi96nuwe+
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - lasmunecasnet

networks:
  lasmunecasnet:
    driver: bridge
