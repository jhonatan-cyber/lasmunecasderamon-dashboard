version: '3.8'

services:
  db:
    image: mariadb:latest
    container_name: db
    env_file:
      - .env
    ports:
      - "3307:3306"
    networks:
      - lasmunecasnet
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8000:80"
    networks:
      - lasmunecasnet
    depends_on:
      - db

  app:
    image: node:22.18.0
    container_name: lasmunecasderamon
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./lasmunecasderamon:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    networks:
      - lasmunecasnet
    depends_on:
      - db

networks:
  lasmunecasnet:
    external: true

volumes:
  db_data:
