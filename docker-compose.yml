version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: admin_dashboard_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-admin_dashboard}
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - admin_dashboard_network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: admin_dashboard_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - admin_dashboard_network

  # Admin Dashboard App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: admin_dashboard_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-admin}
      - DB_NAME=${DB_NAME:-admin_dashboard}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
    depends_on:
      - mysql
      - redis
    networks:
      - admin_dashboard_network
    volumes:
      - ./logs:/app/logs
      - ./public:/app/public

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: admin_dashboard_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - admin_dashboard_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  admin_dashboard_network:
    driver: bridge 